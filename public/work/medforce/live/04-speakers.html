<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>MedForce · Speakers</title>
<link rel="stylesheet" href="mf.css">
<style>
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}.bar .sp{flex:1}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sc{padding:18px;display:flex;flex-direction:column;gap:12px}
  .sc .h{display:flex;gap:12px;align-items:center}
  .sc .av{width:48px;height:48px;border-radius:14px;font-size:15px}
  .sc b{font-size:15px;font-weight:700;display:block;line-height:1.25}
  .sc .d{font-size:12.5px;color:var(--text-3)}
  .sc .af{font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:3px}
  .sc .af span{display:flex;gap:7px;align-items:center}
  .sc .af svg{color:var(--text-3)}
  .sc .st{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:10px;padding:8px 0;text-align:center}
  .sc .st div + div{border-left:1px solid var(--line)}
  .sc .st b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .sc .st span{font-size:11.5px;color:var(--text-3);font-weight:600}
  .sc .ft{display:flex;align-items:center;gap:6px}
  .sc .ft .dot{margin-left:auto;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
  .sc .ft .dot i{width:8px;height:8px;border-radius:50%}
  .sc.feat{box-shadow:var(--sh-2),inset 0 0 0 1.5px var(--navy-200)}
</style></head>
<body><div class="app"><div class="col"><main class="main">
  <div class="ph"><div><h1>Speakers</h1><p>48 trained speakers in your region</p></div><span class="sp"></span><div class="seg"><button><i data-lucide="list" class="sm"></i>List</button><button class="on"><i data-lucide="layout-grid" class="sm"></i>Cards</button></div></div>
  <div class="bar"><span class="filt">Brand <b>Restasis</b><i data-lucide="chevron-down" class="sm"></i></span><span class="filt">Available <b>Jun 21</b><i data-lucide="chevron-down" class="sm"></i></span><span class="filt">Within <b>50 mi</b><i data-lucide="chevron-down" class="sm"></i></span><span class="filt"><i data-lucide="sliders-horizontal" class="sm"></i>More</span><span class="sp"></span><a class="btn ghost" style="height:36px"><i data-lucide="file-spreadsheet" class="sm" style="color:var(--green-600)"></i>Export</a></div>
  <div class="grid" id="g"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script>
<script>
  const P = [['Kevin Townsend', 'OD, FAAO', 'Doctor of Optometry', 'Eye Care Specialists', 'Boston, MA', 12, 2, 'Dry eye', 'v', 'Available'],
    ['Gladys Kanyinda', 'OD, FAAO, Dipl. ABO', 'Doctor of Optometry', 'North Valley Hospital', 'Salem, MA', 18, 1, 'Glaucoma', 's', 'Available'],
    ['Meg Rigden', 'OD, FAAO', 'Doctor of Optometry', 'Schoonborough Hospital', 'Lowell, MA', 9, 0, 'Dry eye', 'g', 'Tentative'],
    ['Maria Rescas', 'MD', 'Ophthalmologist', 'South Providence Care', 'Providence, RI', 22, 3, 'Glaucoma', 'n', 'Available'],
    ['Eric Nadler', 'OD, RPh', 'Optometric Physician', 'Eye Centre of Texas', 'Bellaire, TX', 41, 2, 'Dry eye', 'n', 'Available'],
    ['Sunstra Manerattana', 'OD', 'Doctor of Optometry', 'Rockport Hospital', 'Rockport, MA', 7, 1, 'Dry eye', 'v', 'Unavailable'],
    ['Jagat Shahidullah', 'OD, FAAO', 'Doctor of Optometry', 'Jaysonfort Optometry', 'Nashua, NH', 15, 0, 'Glaucoma', 's', 'Available'],
    ['Stormie Hansford', 'MD', 'Ophthalmologist', 'West Wilmer Hospital', 'Worcester, MA', 28, 2, 'Dry eye', 'g', 'Tentative']];
  const tone = { v: ['var(--violet-100)', 'var(--violet-600)'], s: ['var(--sky-100)', 'var(--sky-600)'], g: ['var(--green-100)', 'var(--green-700)'], n: ['var(--navy-100)', 'var(--navy-700)'] };
  const dot = { Available: 'var(--green-600)', Tentative: 'var(--amber-600)', Unavailable: 'var(--ink-300)' };
  document.getElementById('g').innerHTML = P.map(([n, d, t, a, c, done, pend, br, tn, av], i) => `
    <div class="card sc ${i === 4 ? 'feat' : ''}"><div class="h"><span class="av" style="background:${tone[tn][0]};color:${tone[tn][1]}">${n.split(' ').map(x => x[0]).join('')}</span><div><b>Dr. ${n}</b><span class="d">${d}</span></div></div>
    <div class="af"><span><i data-lucide="stethoscope" class="sm"></i>${t}</span><span><i data-lucide="building-2" class="sm"></i>${a}</span><span><i data-lucide="map-pin" class="sm"></i>${c}</span></div>
    <div class="st"><div><b>${done}</b><br><span>Completed</span></div><div><b>${pend}</b><br><span>Pending</span></div><div><b>${Math.round(done * 0.08)}</b><br><span>Cancelled</span></div></div>
    <div class="ft"><span class="chip navy">${br}</span><span class="dot" style="color:${av === 'Unavailable' ? 'var(--text-3)' : av === 'Tentative' ? 'var(--amber-600)' : 'var(--green-700)'}"><i style="background:${dot[av]}"></i>${av}</span></div></div>`).join('');
  boot({ portal: 'rep', nav: 'Speakers' });
</script></body></html>
