<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="ursula.css"><title>Ursula · Me</title><style>
.pro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 20px 0}
.big{width:96px;height:96px;border-radius:32px;background:linear-gradient(140deg,#C8A2FF,#7FE7F2);display:grid;place-items:center;font-size:32px;font-weight:800;color:#2B0E55;position:relative}
.big i{position:absolute;bottom:-4px;right:-4px;width:28px;height:28px;border-radius:50%;background:var(--card);box-shadow:var(--sh-1);display:grid;place-items:center}
.pro h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:12px}
.pro p{color:var(--ink-3);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.grid .card{padding:12px 14px}.grid b{display:block;font-size:15px;margin-top:2px}
.em{margin-top:10px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.em .ic{width:40px;height:40px;border-radius:12px;background:var(--red-100);color:var(--red-600);display:grid;place-items:center}
.em b{display:block}.em span{font-size:13px;color:var(--ink-3)}
.em .call{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--green-600);color:#fff;display:grid;place-items:center}
.rows{margin-top:10px;padding:2px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border:0}.row .sp{flex:1}
.tg{width:44px;height:26px;border-radius:99px;background:var(--field);position:relative;box-shadow:inset 0 0 0 1px var(--line-2)}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--sh-1)}
</style></head><body>
<div id="sb"></div><div id="ab"></div>

<div class="pg">
  <div class="grid"><div class="card"><span class="label">Employee ID</span><b class="num">SC-0412</b></div><div class="card"><span class="label">Site</span><b>Belle Mare</b></div></div>
  <div class="card em"><span class="ic"><i data-lucide="siren" class="sm"></i></span><div><span>Emergency contact</span><b class="num">Ravi · +230 5812 4471</b></div><span class="call"><i data-lucide="phone" class="sm"></i></span></div>
  <div class="card rows">
    <div class="row"><i data-lucide="languages" class="sm"></i>Language<span class="sp"></span><span class="lang"><span class="on">EN</span><span>FR</span></span></div>
    <div class="row"><i data-lucide="moon" class="sm"></i>Dark mode<span class="sp"></span><span class="tg"></span></div>
    <div class="row" style="color:var(--ink-3)"><i data-lucide="wallet" class="sm"></i>Payslips and leave balance<span class="sp"></span><span class="chip">Not enabled by Sun Coast</span></div>
  </div>
</div>
