<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="ursula.css"><title>Ursula · Splash</title><style>
body{background:radial-gradient(120% 60% at 50% 0%,#F1E6FF 0%,#F5F5FA 60%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.ulogo{height:44px;margin-top:210px;filter:blur(4.4px);mix-blend-mode:multiply}
.loader{position:relative;width:150px;height:6px;margin-top:72px;border-radius:6px;background:rgba(10,10,60,.08);overflow:hidden}
.loader i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:6px;background:var(--grad)}
.msg{margin-top:26px;font-size:15px;font-weight:600;color:var(--ink-2)}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-3);align-items:center}
.steps span{display:flex;gap:6px;align-items:center}
.cust{position:absolute;bottom:60px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cust .m{width:56px;height:56px;border-radius:18px;background:#0E5E4E;color:#F3D27A;display:grid;place-items:center;font-weight:800;font-size:19px}
.cust span{font-size:13px;font-weight:600;color:var(--ink-2)}
</style></head><body>
<div id="sb"></div>
<div class="c">
  <img class="ulogo" src="_logo.png" alt="Ursula logo (blurred)">
  <div class="loader"><i></i></div>
  <div class="msg">Getting your day ready</div>
  <div class="steps"><span><i data-lucide="check" class="sm" style="color:#11875A"></i>Profile</span><span style="color:var(--ink-2)"><i data-lucide="loader-circle" class="sm"></i>Notifications and swipes</span></div>
  <div class="cust"><span class="m">SC</span><span>Sun Coast Resorts</span></div>
</div>
<span class="gest"></span>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="_shared.js"></script><script>document.getElementById('sb').outerHTML=statusBar();boot()</script></body></html>
