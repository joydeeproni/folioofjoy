<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="ursula.css"><title>Ursula · Activate</title><style>
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0}
.ulogo{height:30px;filter:blur(3px);mix-blend-mode:multiply}
.hero{padding:34px 20px 22px}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.in{height:54px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line-2);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:16px}
.in.f2{box-shadow:inset 0 0 0 2px var(--violet-500),0 0 0 4px rgba(138,0,252,.12)}
.in .suf{margin-left:auto;color:var(--ink-3);font-size:14px}
.in svg{color:var(--ink-3)}
.help{display:flex;gap:12px;margin:18px 20px 0;padding:14px;border-radius:16px;background:var(--violet-50);font-size:13.5px;color:var(--ink-2)}
.help svg{color:var(--violet-600);flex:none;margin-top:1px}
.bot{position:absolute;left:20px;right:20px;bottom:36px}
.bot p{text-align:center;font-size:13px;color:var(--ink-3);margin-top:14px}
</style></head><body>
<div id="sb"></div>
<div class="top"><img class="ulogo" src="_logo.png" alt="Ursula logo (blurred)"><span class="lang"><span class="on">EN</span><span>FR</span></span></div>
<div class="hero"><div class="h1">Activate this phone</div><div class="sub">Enter the three details from your HR team. You only do this once.</div></div>
<div class="pg">
  <div class="f"><label>Platform name</label><div class="in"><i data-lucide="building-2" class="sm"></i>suncoast<span class="suf">.ursula.mu</span></div></div>
  <div class="f"><label>Username</label><div class="in"><i data-lucide="user" class="sm"></i>priya.ramdhony</div></div>
  <div class="f"><label>Activation passphrase</label><div class="in f2"><i data-lucide="key-round" class="sm"></i><span class="num" style="letter-spacing:.2em">••••••••••••</span><i data-lucide="eye" class="sm" style="margin-left:auto"></i></div></div>
</div>
<div class="help"><i data-lucide="shield-check" class="sm"></i><span>This phone becomes your key to Ursula. If you change phones, HR can move it for you.</span></div>
<div class="bot"><a class="btn primary">Activate<i data-lucide="arrow-right" class="sm"></i></a><p>No passphrase yet? Ask HR at your site.</p></div>
<span class="gest"></span>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="_shared.js"></script><script>document.getElementById('sb').outerHTML=statusBar();boot()</script></body></html>
