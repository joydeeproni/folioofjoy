<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="ursula.css"><title>Ursula · Offline</title><style>.stat{padding:16px;display:flex;gap:16px;align-items:center;margin-top:14px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--ink-3)}
.tl{margin-top:14px;padding:4px 16px}
.ev{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);position:relative}
.ev:last-child{border:0}
.ev .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ev b{font-weight:650;font-size:15px}.ev span{display:block;font-size:12.5px;color:var(--ink-3)}
.ev time{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.swz{position:absolute;left:20px;right:20px;bottom:108px}
.swz .note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.off{margin:4px 20px 0;padding:12px 14px;border-radius:14px;background:var(--amber-100);color:var(--amber-600);display:flex;gap:10px;font-size:13.5px;align-items:flex-start}
.off b{display:block;color:var(--ink)}</style></head><body>
<div id="sb"></div><div id="ab"></div>
<div class="off"><i data-lucide="cloud-off" class="sm"></i><div><b>You're offline</b>Showing what we saved at 08:40. Your swipe is kept on this phone and sent when you're back online.</div></div>
<div class="pg" style="margin-top:10px">
  <div class="card tl" id="tl"></div>
  <div class="card" style="margin-top:12px;padding:14px 16px;display:flex;gap:12px;align-items:center"><i data-lucide="bell-off" class="sm" style="color:var(--ink-3)"></i><div style="font-size:13.5px;color:var(--ink-2)"><b style="display:block;color:var(--ink)">3 notifications saved</b>You can read them. Approve and reject wait until you're online.</div></div>
</div>
<div class="swz"><a class="btn ghost" style="height:72px;border-radius:24px;color:var(--ink-3)"><i data-lucide="clock"></i>Swipe out saved · waiting to send</a></div>
<div id="bn"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="_shared.js"></script><script>
const ev=[['log-in','#11875A','var(--green-100)','In','Main entrance · fingerprint','08:02',''],['utensils','#B26A00','var(--amber-100)','Out','Lunch','12:31',''],['log-in','#11875A','var(--green-100)','In','Main entrance · fingerprint','13:14',''],['home','#7400D8','var(--violet-100)','Out','Home · Curepipe · not sent yet','14:02','q']];
document.getElementById('tl').innerHTML=ev.map(([ic,c,bg,n,s,t,q])=>'<div class="ev" style="'+(q?'opacity:.85':'')+'"><span class="d" style="background:'+bg+';color:'+c+'"><i data-lucide="'+ic+'" class="sm"></i></span><div><b>'+n+(q?' <span class="chip a" style="display:inline-flex;vertical-align:1px;margin-left:4px">Queued</span>':'')+'</b><span>'+s+'</span></div><time>'+t+'</time></div>').join('');
document.getElementById('sb').outerHTML=statusBar(false,'14:03');document.getElementById('ab').outerHTML=appBar('Swipes','Thu 1 Oct · offline');document.getElementById('bn').outerHTML=bottomNav('Swipes',3);boot()</script></body></html>
