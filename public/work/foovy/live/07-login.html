<style>
  .bg{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.2fr 1fr 1fr;gap:4px}
  .bg div{background-size:cover;background-position:center}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,11,.1) 0%,rgba(12,13,11,.2) 30%,rgba(12,13,11,.92) 58%,var(--bg) 70%)}
  .brand{position:absolute;left:0;right:0;top:360px;text-align:center;z-index:2}
  .brand img{height:40px;filter:blur(6.5px)}
  .brand p{margin:14px auto 0;max-width:280px;font-size:17px;line-height:1.35;color:var(--text-2)}
  .opts{position:absolute;left:20px;right:20px;bottom:50px;display:flex;flex-direction:column;gap:10px;z-index:2}
  .o{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;background:var(--card-2)}
  .o.g{background:#fff;color:#1f1f1f}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .reg{text-align:center;font-size:14px;color:var(--text-3);margin-top:6px}
  .reg b{color:var(--green)}
</style></head>
