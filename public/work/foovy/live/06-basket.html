<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>Foovy · Shopping Basket</title>
<link rel="stylesheet" href="foovy.css">
<style>
  .nav{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 0}
  .nav a{font-size:15px;font-weight:600;color:var(--green)}
  .ttl{padding:10px 20px 0;display:flex;align-items:flex-end;justify-content:space-between}
  .who{display:flex;align-items:center}
  .who img{width:32px;height:32px;border-radius:50%;margin-left:-8px;border:2px solid var(--bg)}
  .who span{width:32px;height:32px;border-radius:50%;margin-left:-8px;border:2px solid var(--bg);background:var(--card-2);display:grid;place-items:center;color:var(--green)}
  .add{margin:16px 20px 0;height:50px;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--text-3);font-size:15px}
  .add svg{color:var(--green)}
  .list{margin:14px 20px 0}
  .it{display:flex;align-items:center;gap:12px;height:58px;border-bottom:1px solid var(--line)}
  .cb{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);flex:none;display:grid;place-items:center}
  .it.done .cb{background:var(--green);box-shadow:none}
  .it img.f{width:34px;height:34px}
  .it b{font-weight:600;font-size:16px}
  .it small{display:block;font-size:12.5px;color:var(--text-3)}
  .it.done b{text-decoration:line-through;color:var(--text-3)}
  .it.done img.f{opacity:.45}
  .it .by{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
  .it .by img{width:22px;height:22px;border-radius:50%}
  .have{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:11px;font-weight:700;color:var(--freezer);background:rgba(79,168,245,.14);padding:2px 7px;border-radius:6px;vertical-align:2px}
  .chat{margin:16px 20px 0;background:var(--card);border-radius:18px;padding:12px 14px}
  .msg{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
  .msg img{width:28px;height:28px;border-radius:50%}
  .msg p{background:var(--card-2);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;line-height:1.3}
  .msg.me{flex-direction:row-reverse}
  .msg.me p{background:var(--green);color:var(--green-ink);border-radius:14px 4px 14px 14px}
  .inp{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--bg-2);padding:0 12px;color:var(--text-3);font-size:14px}
  .inp svg{margin-left:auto;color:var(--green)}
  .cta{position:absolute;left:20px;right:20px;bottom:40px;display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
</style></head>
<body>
<div data-status></div>
<div class="nav"><a>Done</a><a><i data-lucide="share" class="sm"></i></a></div>
<div class="ttl"><div class="h1">Shopping Basket</div><div class="who"><img src="assets/av-1474d3.png"><img src="assets/av-9923a3.png" style="margin-left:-8px"><span><i data-lucide="plus" class="sm"></i></span></div></div>
<div class="add"><i data-lucide="plus"></i>Add new item</div>
<div class="list">
  <div class="it"><span class="cb"></span><img class="f" src="assets/food/tomato.png"><div><b>Tomatoes</b><small>6 · vine</small></div><span class="by">You</span></div>
  <div class="it"><span class="cb"></span><img class="f" src="assets/food/egg.png"><div><b>Eggs <span class="have"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M5 10h14M9 5v2M9 13v3"/></svg>2 at home</span></b><small>12 · free range</small></div><span class="by"><img src="assets/av-9923a3.png">Ben</span></div>
  <div class="it"><span class="cb"></span><img class="f" src="assets/food/glass_of_milk.png"><div><b>Milk</b><small>2 pints · semi-skimmed</small></div><span class="by"><img src="assets/av-9923a3.png">Ben</span></div>
  <div class="it"><span class="cb"></span><img class="f" src="assets/food/cheese_wedge.png"><div><b>Cheddar <span class="have"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M5 10h14M9 5v2M9 13v3"/></svg>half left</span></b><small>200 g</small></div><span class="by">You</span></div>
  <div class="it done"><span class="cb"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#06260F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><img class="f" src="assets/food/leafy_green.png"><div><b>Lettuce</b><small>1 head</small></div><span class="by">3d ago</span></div>
</div>
<div class="chat">
  <div class="msg"><img src="assets/av-9923a3.png"><p>Can you get extra eggs? Pancakes on Sunday 🥞</p></div>
  <div class="msg me"><img src="assets/av-1474d3.png"><p>On it. We still have 2.</p></div>
  <div class="inp">Add a note for Ben<i data-lucide="send" class="sm"></i></div>
</div>
<div class="cta"><a class="btn ghost"><i data-lucide="message-circle" class="sm"></i>WhatsApp</a><a class="btn primary"><i data-lucide="store" class="sm"></i>Shop Groceries</a></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script><script>boot();</script>
</body></html>
