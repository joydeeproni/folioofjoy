<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>Foovy · Generating</title>
<link rel="stylesheet" href="foovy.css">
<style>
  .nav{padding:2px 16px 0}.ib{width:38px;height:38px;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
  .ttl{padding:10px 20px 0}
  .pot{position:absolute;left:0;right:0;top:196px;display:flex;flex-direction:column;align-items:center}
  .orbit{width:220px;height:220px;border-radius:50%;position:relative;background:radial-gradient(circle,rgba(52,199,89,.18),rgba(52,199,89,0) 70%)}
  .orbit::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(52,199,89,.35)}
  .orbit img{position:absolute;width:64px;height:64px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
  .pot b{font-size:18px;margin-top:26px}
  .pot p{color:var(--text-3);font-size:14px;margin-top:4px}
  .bars{width:200px;height:6px;border-radius:4px;background:var(--card-2);margin-top:18px;overflow:hidden}
  .bars i{display:block;height:100%;width:62%;background:var(--green);border-radius:4px}
  .prefs{display:flex;gap:6px;padding:14px 20px 0}.prefs .chip{padding:0 10px;gap:5px}
  .prefs .chip svg{color:var(--green)}
  .checks{position:absolute;left:20px;right:20px;top:560px;background:var(--card);border-radius:18px;padding:6px 16px}
  .ck{display:flex;align-items:center;gap:12px;height:44px;font-size:14px;color:var(--text-2);border-bottom:1px solid var(--line)}
  .ck:last-child{border:0}
  .ck .o{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ck .o.done{background:var(--green);color:var(--green-ink)}
  .ck .o.run{box-shadow:inset 0 0 0 2px var(--green);position:relative}
  .ck .o.run::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
  .ck .o.wait{box-shadow:inset 0 0 0 2px var(--line-2)}
  .ck.w{color:var(--text-3)}
  .ck span.n{margin-left:auto;font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
</style></head><body>
<div data-status></div><div class="nav"><span class="ib"><i data-lucide="x"></i></span></div>
<div class="ttl"><div class="h1">Generating Recipes</div></div>
<div class="prefs"><span class="chip"><i data-lucide="users" class="sm"></i>Serves 2</span><span class="chip"><i data-lucide="timer" class="sm"></i>Under 30 min</span><span class="chip"><i data-lucide="leaf" class="sm"></i>No nuts</span></div>
<div class="pot"><div class="orbit"><img src="assets/food/tomato.png" style="left:78px;top:6px"><img src="assets/food/cheese_wedge.png" style="left:150px;top:118px"><img src="assets/food/bacon.png" style="left:6px;top:118px"></div>
<b>Tomato, cheese and bacon</b><p>Finding recipes for you</p><div class="bars"><i></i></div></div>
<div class="checks">
  <div class="ck"><span class="o done"><i data-lucide="check" class="sm"></i></span>Reading your fridge<span class="n">14 items</span></div>
  <div class="ck"><span class="o done"><i data-lucide="check" class="sm"></i></span>Putting eat-me-first items first<span class="n">3 items</span></div>
  <div class="ck"><span class="o run"></span>Matching recipes<span class="n">128 checked</span></div>
  <div class="ck w"><span class="o wait"></span>Adding what you’re missing to Basket</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script><script>boot();</script></body></html>
