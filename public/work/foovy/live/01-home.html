<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>Foovy · Home</title>
<link rel="stylesheet" href="foovy.css">
<style>
  .top{padding:6px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .top .hi{font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--green)}
  .top .h1{margin-top:6px;max-width:250px}
  .top .me{width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--green)}
  .top .me img{width:100%;height:100%}
  .fridge{margin:18px 20px 0;height:238px;border-radius:26px;position:relative;background:linear-gradient(160deg,#F3F1EA,#DEDBD1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 24px 44px -24px rgba(0,0,0,.8);overflow:hidden}
  .fridge .split{position:absolute;left:0;right:0;top:78px;height:3px;background:rgba(0,0,0,.08)}
  .fridge .handle{position:absolute;right:18px;width:8px;border-radius:5px;background:linear-gradient(90deg,#b9b6ad,#e9e7e0,#b3b0a7)}
  .fridge .logo{position:absolute;left:22px;top:24px;height:26px;filter:blur(4.5px);opacity:.85}
  /* fridge magnets — physical objects on the door, drawn in CSS/SVG */
  .letters{position:absolute;left:170px;top:17px;display:flex;align-items:flex-end;gap:1px}
  .letters span{font-family:'Fredoka',var(--font);font-weight:700;font-size:31px;line-height:1;display:inline-block;
    text-shadow:0 1px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.14),0 5px 6px rgba(0,0,0,.28);-webkit-text-stroke:.6px rgba(0,0,0,.12)}
  .letters .sp{width:9px}
  .dome{position:absolute;width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#b9f5c9 0,#5fdc80 22%,#1f9e43 70%,#137a31 100%);
    box-shadow:0 4px 6px -1px rgba(0,0,0,.35),inset 0 -2px 3px rgba(0,0,0,.18)}
  .mag{position:absolute;filter:drop-shadow(0 4px 4px rgba(0,0,0,.22)) drop-shadow(0 1px 1px rgba(0,0,0,.2))}
  .polaroid{position:absolute;background:#fbfaf6;padding:4px 4px 12px;border-radius:2px;box-shadow:0 7px 12px -5px rgba(0,0,0,.4)}
  .polaroid img{display:block;width:44px;height:40px;object-fit:cover}
  .polaroid small{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-family:'Fredoka',var(--font);font-size:7.5px;font-weight:600;color:#6b6552}
  .note{position:absolute;left:24px;top:96px;width:124px;padding:12px 11px 9px;background:#FFF6B8;transform:rotate(-3deg);box-shadow:0 8px 14px -6px rgba(0,0,0,.35);color:#3a3208;font-size:13px;line-height:1.25;font-weight:600}
  .note small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:4px}
  .fridge .open{position:absolute;left:14px;right:14px;bottom:14px;height:44px;border-radius:14px;background:rgba(12,13,11,.9);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;font-weight:600}
  .fridge .open b{color:var(--eatme)}
  .fridge .open svg:last-child{margin-left:auto}
  .sec{padding:22px 20px 0}
  .eat{display:flex;gap:16px}
  .eat .it{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
  .acts{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
  .act{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:92px;background:var(--card)}
  .act b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .act span{font-size:12.5px;color:var(--text-3)}
  .act .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
</style></head>
<body>
<div data-status></div>
<div class="top"><div><div class="hi">HELLO GRACE</div><div class="h1">What would you like to do today?</div></div><div class="me"><img src="assets/av-1474d3.png" alt=""></div></div>
<div class="fridge">
  <img class="logo" src="assets/foovy-logo.png" alt="Client logo (blurred)">
  <span class="split"></span>
  <span class="handle" style="top:22px;height:40px"></span><span class="handle" style="top:98px;height:70px"></span>
  <!-- letter magnets -->
  <div class="letters" aria-hidden="true"><span style="color:#E8423A;transform:rotate(-8deg)">E</span><span style="color:#F5B519;transform:rotate(6deg) translateY(-2px)">A</span><span style="color:#2F8FE8;transform:rotate(-4deg)">T</span><span class="sp"></span><span style="color:#34C759;transform:rotate(7deg) translateY(-3px)">M</span><span style="color:#8E5BE8;transform:rotate(-6deg)">E</span></div>
  <!-- souvenir magnet: London bus -->
  <svg class="mag" style="left:162px;top:112px;transform:rotate(-7deg)" width="66" height="44" viewBox="0 0 66 44" aria-hidden="true">
    <rect x="1" y="1" width="64" height="38" rx="7" fill="#fff"/>
    <rect x="4" y="4" width="58" height="30" rx="5" fill="#D8322B"/>
    <rect x="4" y="18" width="58" height="2.2" fill="#A61F1A"/>
    <g fill="#CFE8F5"><rect x="8" y="7.5" width="9" height="7" rx="1.5"/><rect x="19.5" y="7.5" width="9" height="7" rx="1.5"/><rect x="31" y="7.5" width="9" height="7" rx="1.5"/><rect x="42.5" y="7.5" width="9" height="7" rx="1.5"/><rect x="54" y="7.5" width="5" height="7" rx="1.5"/>
    <rect x="8" y="22" width="9" height="6.5" rx="1.5"/><rect x="19.5" y="22" width="9" height="6.5" rx="1.5"/><rect x="31" y="22" width="9" height="6.5" rx="1.5"/><rect x="47" y="22" width="12" height="9" rx="1.5"/></g>
    <rect x="42" y="21" width="3.5" height="12" fill="#3b0d0b" opacity=".55"/>
    <circle cx="15" cy="36" r="5.2" fill="#1c1c1c" stroke="#fff" stroke-width="2"/><circle cx="50" cy="36" r="5.2" fill="#1c1c1c" stroke="#fff" stroke-width="2"/>
    <circle cx="15" cy="36" r="1.8" fill="#9a9a9a"/><circle cx="50" cy="36" r="1.8" fill="#9a9a9a"/>
    <path d="M6 6 h24" stroke="#fff" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <!-- photo magnet -->
  <div class="polaroid" style="left:244px;top:90px;transform:rotate(6deg)"><img src="assets/pasties.jpg" alt=""><small>Gran’s pasties</small></div>
  <span class="dome" style="left:260px;top:83px;width:16px;height:16px;background:radial-gradient(circle at 35% 30%,#ffd9d5 0,#ff7a6e 24%,#d8322b 72%,#a41f19 100%)"></span>
  <!-- round button magnet -->
  <svg class="mag" style="left:228px;top:150px" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#F5C33B"/><circle cx="13" cy="13" r="12" fill="url(#gl)"/><circle cx="9" cy="11" r="1.6" fill="#3a2a00"/><circle cx="17" cy="11" r="1.6" fill="#3a2a00"/><path d="M8.2 15.2c2.6 3 7 3 9.6 0" fill="none" stroke="#3a2a00" stroke-width="1.8" stroke-linecap="round"/><defs><radialGradient id="gl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient></defs></svg>
  <div class="note">Milk + eggs for Sunday pancakes!<small>— Ben, yesterday</small></div>
  <span class="dome" style="left:78px;top:88px"></span>
  <div class="open"><i data-lucide="refrigerator" class="sm"></i><span>14 items · <b>3 to eat first</b></span><i data-lucide="chevron-right" class="sm"></i></div>
</div>
<div class="sec">
  <div class="sec-h"><b>Eat me first</b><a>See all</a></div>
  <div class="eat">
    <div class="it"><span data-ring="tomato,1,10,62"></span>Tomatoes</div>
    <div class="it"><span data-ring="leafy_green,2,7,62"></span>Spinach</div>
    <div class="it"><span data-ring="glass_of_milk,3,10,62"></span>Milk</div>
    <div class="it"><span data-ring="avocado,6,10,62"></span>Avocado</div>
  </div>
</div>
<div class="sec">
  <div class="acts">
    <div class="act" style="background:linear-gradient(150deg,#1d3a22,#16211a)"><span class="ic" style="background:var(--green);color:var(--green-ink)"><i data-lucide="chef-hat" class="sm"></i></span><b>What should I cook?</b><span>From your eat-me items</span></div>
    <div class="act"><span class="ic" style="background:rgba(79,168,245,.16);color:var(--freezer)"><i data-lucide="shopping-basket" class="sm"></i></span><b>Shopping Basket</b><span>6 items · 2 new</span></div>
  </div>
</div>
<div data-tabs="For You"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script><script>boot();</script>
</body></html>
