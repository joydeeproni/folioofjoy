<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Teen Health Planner · Quiz</title>
<link rel="stylesheet" href="thp.css">
<style>
  .qh{display:flex;align-items:center;gap:12px;padding:6px 16px 0}
  .qh .b{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh-1)}
  .qh .t{flex:1}
  .qh .t b{display:block;font-size:17px}
  .qh .t span{font-size:13px;color:var(--ink-3);font-weight:600}
  .prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:16px 16px 0}
  .prog i{height:6px;border-radius:4px;background:#EFE6E8}
  .prog i.ok{background:var(--ink-2)} .prog i.cur{background:var(--ink)}
  .timer{display:flex;justify-content:center;margin-top:26px;position:relative}
  .timer svg{width:118px;height:118px;transform:rotate(-90deg)}
  .timer b{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .timer small{position:absolute;top:80px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-3);font-weight:600}
  .q{padding:22px 24px 0;text-align:center}
  .q span{font-size:13px;font-weight:700;color:var(--ink-3)}
  .q h2{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin-top:6px;text-wrap:balance}
  .ans{display:flex;flex-direction:column;gap:10px;padding:22px 16px 0}
  .a{height:58px;border-radius:18px;background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:17px;font-weight:600}
  .a .k{width:30px;height:30px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink-3)}
  .a.right{background:var(--green-100);box-shadow:inset 0 0 0 2px var(--green);color:#3E6B34}
  .a.right .k{background:var(--green);color:#fff}
  .a .pts{margin-left:auto;font-size:14px;font-weight:800;color:#3E6B34}
  .streak{position:absolute;left:16px;right:16px;bottom:34px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--ink);color:#fff}
  .streak .dots{display:flex;gap:5px;margin-left:auto}
  .streak .dots i{width:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.2)}
  .streak .dots i.on{background:#E9CF93}
  .streak b{font-size:14px}.streak span{font-size:12.5px;opacity:.7;display:block}
</style></head>
<body>
<div class="qh"><span class="b"><i data-lucide="x"></i></span><div class="t"><b>Quiz 2 · Sleep</b><span>Medium difficulty</span></div><span class="nav" style="padding:0"><span class="pts"><i data-lucide="star" class="sm"></i><span class="num" id="pts">321</span></span></span></div>
<div class="prog" id="prog"></div>
<div class="timer"><svg viewBox="0 0 118 118"><circle cx="59" cy="59" r="52" fill="none" stroke="#F3EAEC" stroke-width="10"/><circle id="arc" cx="59" cy="59" r="52" fill="none" stroke="url(#sg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="130"/><defs><linearGradient id="sg"><stop offset="0" stop-color="#E62224"/><stop offset="1" stop-color="#F2B600"/></linearGradient></defs></svg><b id="sec">12</b><small>seconds</small></div>
<div class="q"><span>Question 4 of 10</span><h2>How much sleep do most teens need each night?</h2></div>
<div class="ans">
  <div class="a"><span class="k">A</span>5–6 hours</div>
  <div class="a"><span class="k">B</span>6–7 hours</div>
  <div class="a" id="c"><span class="k">C</span>8–10 hours</div>
  <div class="a"><span class="k">D</span>11–12 hours</div>
</div>
<div class="streak"><span style="width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#E9CF93"><i data-lucide="flame" class="sm"></i></span><div><b>5 in a row challenge</b><span>No mistakes so far</span></div><span class="dots"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script>
<script>
  const Q = new URLSearchParams(location.search), RIGHT = Q.get('a') === 'right', SEC = +(Q.get('s') ?? 12);
  document.getElementById('prog').innerHTML = [...Array(10)].map((_, i) => `<i class="${i < 3 || (RIGHT && i === 3) ? 'ok' : i === 3 ? 'cur' : ''}"></i>`).join('');
  document.getElementById('sec').textContent = SEC;
  document.getElementById('arc').setAttribute('stroke-dashoffset', 327 * (1 - SEC / 20));
  if (RIGHT) { const c = document.getElementById('c'); c.classList.add('right'); c.insertAdjacentHTML('beforeend', '<span class="pts">+10 ★</span>'); document.getElementById('pts').textContent = '331'; }
  boot({ tabs: false });
</script></body></html>
