<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Teen Health Planner · Results</title>
<link rel="stylesheet" href="thp.css">
<style>
  body{background:var(--bg)}
  .top{padding:4px 16px 0;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .top .b{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh-1)}
  .top h1{flex:1;font-size:20px}
  .score{margin:14px 16px 0;padding:18px;border-radius:24px;background:var(--sunrise);color:#fff;box-shadow:0 14px 30px -16px rgba(200,60,30,.55)}
  .score .big{display:flex;align-items:flex-end;gap:10px}
  .score .big b{font-size:64px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .score .big span{font-size:16px;font-weight:600;padding-bottom:8px;opacity:.9}
  .score .row{display:flex;gap:8px;margin-top:14px}
  .score .row span{flex:1;height:36px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
  .earned{margin:12px 16px 0;padding:14px 16px;border-radius:22px;background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px var(--line)}
  .earned .l{display:flex;justify-content:space-between;font-size:14.5px;padding:5px 0;font-variant-numeric:tabular-nums}
  .earned .l b{display:flex;align-items:center;gap:5px}
  .earned .l svg{color:var(--amber)}
  .earned .t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:17px;font-weight:800}
  .ch{margin:12px 16px 0;padding:14px 16px;border-radius:22px;background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px var(--line)}
  .ch h2{font-size:17px;letter-spacing:-.01em}
  .ch p{font-size:13px;color:var(--ink-3);margin-top:2px}
  .qz{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:14px;margin-top:8px;box-shadow:inset 0 0 0 1.5px var(--line-2);font-size:14px;font-weight:600}
  .qz small{color:var(--ink-3);font-weight:500}
  .qz .r{margin-left:auto;display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--ink-2)}
  .qz.done{background:var(--tint);box-shadow:none}.qz.done .r{color:var(--ink-3)}
  .qz.cur{box-shadow:inset 0 0 0 2px var(--ink)}
  .qz.lock{opacity:.5}
  .cta{position:absolute;left:16px;right:16px;bottom:30px;background:var(--ink);color:#fff}
</style></head>
<body>
<div class="status"><span class="num">9:41</span><span class="r"><i data-lucide="signal" class="sm"></i><i data-lucide="wifi" class="sm"></i><i data-lucide="battery-full"></i></span></div>
<div class="top"><span class="b"><i data-lucide="x"></i></span><h1>Results</h1><span class="b"><i data-lucide="share-2"></i></span></div>
<section class="score"><span style="font-size:14px;font-weight:700;opacity:.85">Quiz 2 · Sleep</span><div class="big"><b>10</b><span>of 10 correct<br>Perfect round</span></div>
  <div class="row"><span><i data-lucide="check-circle-2" class="sm"></i>10 correct</span><span><i data-lucide="x-circle" class="sm"></i>0 wrong</span><span><i data-lucide="timer" class="sm"></i>1:48</span></div></section>
<section class="earned"><div class="l"><span>This quiz</span><b><i data-lucide="star" class="sm"></i>100</b></div><div class="l"><span>Perfect-round bonus</span><b><i data-lucide="star" class="sm"></i>50</b></div><div class="l t"><span>Total</span><b><i data-lucide="star" class="sm"></i>150</b></div></section>
<section class="ch"><h2>The 5 in a row challenge</h2><p>Finish all five without a wrong answer to unlock the Quiz badge.</p>
  <div class="qz done"><i data-lucide="check-circle-2" class="sm" style="color:var(--green)"></i>Quiz 1 <small>Easy</small><span class="r">+50</span></div>
  <div class="qz done"><i data-lucide="check-circle-2" class="sm" style="color:var(--green)"></i>Quiz 2 <small>Medium</small><span class="r">+100</span></div>
  <div class="qz cur"><i data-lucide="circle-dot" class="sm" style="color:var(--ink)"></i>Quiz 3 <small>Medium</small><span class="r"><i data-lucide="star" class="sm"></i>+150</span></div>
  <div class="qz lock"><i data-lucide="lock" class="sm"></i>Quiz 4 <small>Hard</small><span class="r"><i data-lucide="star" class="sm"></i>+200</span></div>
</section>
<a class="btn cta">Next quiz<i data-lucide="arrow-right" class="sm"></i></a>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons({ attrs: { 'stroke-width': 2 } });</script>
</body></html>
