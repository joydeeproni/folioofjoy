<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Fido · Skills</title>
<link rel="stylesheet" href="fido.css">
<style>
  .head h1{font-size:28px}
  .tree{position:absolute;left:0;right:0;top:188px;height:470px}
  .tree svg.links{position:absolute;inset:0}
  .n{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:110px;text-align:center}
  .n .o{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;color:var(--char);position:relative}
  .n .lv{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--char);font-size:11px;font-weight:700;display:grid;place-items:center}
  .n .t{font-size:12.5px;font-weight:500;margin-top:8px;line-height:1.25;background:#000;padding:1px 5px;border-radius:5px;position:relative}
  .n.lock .o{background:var(--char);color:rgba(255,255,255,.45)}.n.lock .t{color:rgba(255,255,255,.45)}
  .n.cur .o{background:var(--yellow);animation:pulseRing 1.6s ease-out infinite}
  .root{position:absolute;left:50%;top:392px;width:92px;transform:translateX(-50%)}
  .next{position:absolute;left:24px;right:24px;bottom:108px;border-radius:26px;background:var(--yellow);color:var(--char);padding:16px 18px;display:flex;gap:14px;align-items:center}
  .next .o{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.55);display:grid;place-items:center}
  .next b{display:block;font-size:15.5px;font-weight:600}.next span{font-size:13px}
  .pb{height:6px;border-radius:4px;background:rgba(50,54,65,.18);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;width:60%;background:var(--char);border-radius:4px}
</style></head>
<body>
<header class="head"><h1>Milou’s Skills</h1><span class="sq press"><i data-lucide="share"></i></span></header>
<nav class="pills"><span class="on">Tree</span><span>Timeline</span><span>Badges</span></nav>
<section class="tree">
  <svg class="links" viewBox="0 0 390 470" fill="none" stroke-linecap="round" stroke-width="4">
    <path class="a-draw" style="--len:180" d="M195 405 C195 375 80 385 80 340" stroke="#FFD6A5"/>
    <path class="a-draw" style="--len:180" d="M195 405 C195 375 310 385 310 340" stroke="#BCB2FD"/>
    <path class="a-draw" style="--len:180" d="M195 405 L195 300" stroke="#FFACAE"/>
    <path class="a-draw" style="--len:140;animation-delay:.5s" d="M80 340 L80 220" stroke="#FFD6A5"/>
    <path class="a-draw" style="--len:140;animation-delay:.5s" d="M310 340 L310 220" stroke="#BCB2FD"/>
    <path class="a-draw" style="--len:140;animation-delay:.5s" d="M195 300 L195 175" stroke="#FFACAE"/>
    <path d="M80 200 C80 150 110 130 112 100M310 200 C310 150 280 130 278 100" stroke="#323641" stroke-dasharray="2 10"/>
  </svg>
  <div class="n" style="left:80px;top:340px"><span class="o" style="background:var(--peach)"><span class="lv">3</span><i data-lucide="droplets"></i></span><span class="t">Potty</span></div>
  <div class="n" style="left:310px;top:340px"><span class="o" style="background:var(--lilac)"><span class="lv">3</span><i data-lucide="box"></i></span><span class="t">Crate</span></div>
  <div class="n" style="left:195px;top:300px"><span class="o" style="background:var(--pink)"><span class="lv">2</span><i data-lucide="hand"></i></span><span class="t">Gentle mouth</span></div>
  <div class="n" style="left:80px;top:230px"><span class="o" style="background:var(--peach)"><span class="lv">1</span><i data-lucide="door-open"></i></span><span class="t">Asks to go out</span></div>
  <div class="n cur" style="left:310px;top:230px"><span class="o"><i data-lucide="bed-double"></i></span><span class="t">Settle on a mat</span></div>
  <div class="n" style="left:195px;top:170px"><span class="o" style="background:var(--sky)"><span class="lv">1</span><i data-lucide="megaphone"></i></span><span class="t">Name game</span></div>
  <div class="n lock" style="left:112px;top:80px"><span class="o"><i data-lucide="lock" class="sm"></i></span><span class="t">Home alone 1 hr</span></div>
  <div class="n lock" style="left:278px;top:80px"><span class="o"><i data-lucide="lock" class="sm"></i></span><span class="t">Recall at the park</span></div>
  <span id="root"></span>
</section>
<div class="next a-rise" style="animation-delay:.9s"><span class="o"><i data-lucide="bed-double"></i></span><div style="flex:1"><b>Next unlock: Settle on a mat</b><span>3 of 5 crate quests done</span><div class="pb"><i class="a-grow" style="animation-delay:1.1s"></i></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script>
<script>document.getElementById('root').outerHTML = ILL.pup('root'); stagger('.tree .n', 300, 70, 'a-pop'); boot({ tab: 'Me' });</script>
</body></html>
