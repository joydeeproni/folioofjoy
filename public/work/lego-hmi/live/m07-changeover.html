<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Moulding · Changeover</title><link rel="stylesheet" href="carbon.min.css"><link rel="stylesheet" href="mobile.css">
<style>
  .hero{margin:12px 16px 0;background:var(--cds-layer-01);padding:14px}
  .mv{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:6px;margin-top:6px}
  .mv b{display:block;font-size:17px;font-weight:600}.mv small{font-size:12px;color:var(--cds-text-secondary)}
  .mv .ar{color:#78a9ff;display:grid;place-items:center}
  .prog{display:flex;align-items:center;gap:12px;margin-top:14px}
  .bar{flex:1;height:8px;background:#393939}.bar i{display:block;height:100%;width:56%;background:#0f62fe}
  .ck{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;background:var(--cds-layer-01);border-bottom:1px solid var(--cds-border-subtle-01)}
  .ck .b{width:22px;height:22px;border:1px solid #8d8d8d;flex:none;margin-top:1px;display:grid;place-items:center}
  .ck.done .b{background:#f4f4f4;border-color:#f4f4f4;color:#161616}
  .ck.done .t{color:var(--cds-text-secondary);text-decoration:line-through;text-decoration-color:#6f6f6f}
  .ck .t{font-size:15px;line-height:20px}
  .ck .s{font-size:12px;color:var(--cds-text-secondary);margin-top:2px}
  .ck.now{box-shadow:inset 3px 0 0 #4589ff;background:#1c2432}
  .ck .v{margin-left:auto;font-family:'IBM Plex Mono';font-size:13px;color:#a6c8ff;white-space:nowrap}
</style></head><body>
<div class="body">
  <div class="hero"><span class="lab">Changeover · machine 152671 · R2/P3</span>
    <div class="mv"><div><b class="num">2291650</b><small>Plate 2×2 · out</small></div><span class="ar"><span data-ci="arrow--right"></span></span><div><b class="num">2360410</b><small>Tile 2×2 · in</small></div></div>
    <div class="prog"><div class="bar"><i></i></div><span class="num" style="font-size:14px">5 of 9</span><span class="cds--tag cds--tag--blue cds--tag--sm"><span class="cds--tag__label">32 min</span></span></div></div>
  <div class="sect"><h3>Checklist</h3><span class="lab">Target 45 min</span></div>
  <div id="list"></div>
</div>
<script src="icons.js"></script><script src="icons-extra.js"></script><script src="m-shared.js"></script>
<script>
const K = [
  [1, 'Empty hopper and purge ABS', 'Colour 986 → 312', '13:52'], [1, 'Unmount mould 2291650', 'Crane C2 · 2 people', '14:01'],
  [1, 'Mount mould 2360410', 'Clamp force 90 t', '14:10'], [1, 'Connect cooling circuits 1–4', 'Leak test passed', '14:14'],
  [1, 'Link equipment · hot runner HR-8', 'Scanned HR-8-0415', '14:18'],
  [2, 'Heat mould to temperature', 'Zones 1–8 · target 240 °C', '231 °C'],
  [0, 'Load granulate ABS 4130312', 'Lot 88219 · dryer 80 °C', ''], [0, 'Run-in · 20 test shots', 'Opens run-in on the machine tablet', ''], [0, 'Release to production', 'Quality sign-off', ''],
];
document.getElementById('list').innerHTML = K.map(([d, t, s, v]) => '<div class="ck ' + (d === 1 ? 'done' : d === 2 ? 'now' : '') + '"><span class="b">' + (d === 1 ? ci('checkmark', 16) : d === 2 ? ci('in-progress', 16) : '') + '</span><div><div class="t">' + t + '</div><div class="s">' + s + '</div></div><span class="v">' + v + '</span></div>').join('');
mboot({ title: 'Changeover', sub: 'Module 9 · shift B', back: true, tab: 'Shift' });
</script></body></html>
