<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Moulding · Set stop code</title><link rel="stylesheet" href="carbon.min.css"><link rel="stylesheet" href="mobile.css">
<style>
  iframe{position:absolute;inset:0;width:390px;height:844px;border:0}
  .codes{padding:0 16px}
  .code{display:flex;align-items:center;gap:14px;height:64px;padding:0 14px;background:var(--cds-layer-02);margin-bottom:1px;position:relative}
  .code .ic{color:var(--cds-icon-secondary)}
  .code b{font-size:16px;font-weight:400;display:block}
  .code small{font-size:12px;color:var(--cds-text-secondary)}
  .code .r{margin-left:auto;display:flex;align-items:center;gap:10px}
  .code .rad{width:20px;height:20px;border-radius:50%;border:1px solid #8d8d8d;flex:none}
  .code.on{background:#0f2a66;box-shadow:inset 0 0 0 2px #4589ff}
  .code.on .rad{border:6px solid #f4f4f4;background:#0f62fe}
  .code.on .ic{color:#78a9ff}
  .rem{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-size:14px;color:var(--cds-text-secondary)}
  .tg{width:48px;height:24px;border-radius:12px;background:#0f62fe;position:relative}.tg::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
  .ft{padding:12px 16px 0}
  .lab2{padding:4px 16px 8px}
</style></head><body>
<iframe src="m03-machine.html" tabindex="-1" aria-hidden="true"></iframe>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="hd"><div><h2>Set stop code</h2><p>Machine 152662 · stopped 14:22 · 3 min</p></div><span class="x"><span data-ci="close"></span></span></div>
  <div class="lab lab2">Suggested from alarm E-2041</div>
  <div class="codes" id="codes"></div>
  <div class="rem">Remember machine 152662<span class="tg"></span></div>
  <div class="ft"><button class="cds--btn cds--btn--primary full" id="confirm" style="opacity:.35">Select a stop code</button></div>
</div>
<div class="hi"></div>
<script src="icons.js"></script><script src="icons-extra.js"></script><script src="m-shared.js"></script>
<script>
const C = [['3', 'tool-kit', 'Breakdown', 'VITS no. 3', 1], ['2', 'settings', 'Maintenance', 'VITS no. 2'], ['8', 'calendar', 'Planned stop', 'VITS no. 8'], ['5', 'renew', 'Cleaning', 'VITS no. 5'], ['11', 'box', 'Material shortage', 'VITS no. 11']];
const SEL = MQ.get('sel') === '1';
document.getElementById('codes').innerHTML = C.map(([k, ic, n, v, sug]) => '<div class="code ' + (SEL && k === '3' ? 'on' : '') + '" data-k="' + k + '"><span class="ic" data-ci="' + ic + '" data-s="24"></span><div><b>' + n + '</b><small>' + v + '</small></div><span class="r">' + (sug ? '<span class="cds--tag cds--tag--blue cds--tag--sm"><span class="cds--tag__label">Suggested</span></span>' : '') + '<i class="rad"></i></span></div>' + (sug ? '<div class="lab" style="padding:12px 0 8px">All stop codes</div>' : '')).join('');
if (SEL) { const b = document.getElementById('confirm'); b.style.opacity = 1; b.innerHTML = 'Set Breakdown<span data-ci="arrow--right"></span>'; }
document.body.classList.add('cds--g100'); hydrateIcons();
</script></body></html>
