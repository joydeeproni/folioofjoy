<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>SellCrowd · Leaderboards</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="sc.css">
<style>
  .appbar{padding-bottom:26px}
  .top{margin:10px 18px 0;height:86px;border-radius:43px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:14px;padding:0 20px 0 12px;box-shadow:0 18px 36px -16px rgba(10,20,90,.55);position:relative;z-index:1}
  .top .big{width:62px;height:62px;border-radius:50%;background:linear-gradient(150deg,#FFD84D,#FF9A1F);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;position:relative}
  .top .big .cr{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
  .top small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600}
  .top b{font-size:18px;font-weight:800;letter-spacing:-.015em}
  .top .st{margin-left:auto;text-align:right}
  .top .st b{font-size:20px;display:block;line-height:1.1}
  .top .st span{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
  .ptabs{background:var(--bg);justify-content:space-between;padding-right:22px;height:62px}
  .th{display:grid;grid-template-columns:66px 1fr 50px 64px 44px;padding:12px 18px 8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:#fff;border-bottom:1px solid var(--line)}
  .th span:nth-child(n+3){text-align:right}
  .tr{display:grid;grid-template-columns:66px 1fr 50px 64px 44px;align-items:center;padding:0 18px;height:62px;background:#fff;position:relative;font-size:14px}
  .tr + .tr{margin-top:8px}
  .tr .rk{width:50px;height:26px;border-radius:13px;background:var(--grad);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
  .tr .rk.g{background:linear-gradient(150deg,#FFD84D,#F8B400);color:#3A2A00}
  .tr .rk.s{background:linear-gradient(150deg,#E6E9F2,#C9CEDD);color:#3A4260}
  .tr .rk.b{background:linear-gradient(150deg,#FFC08A,#E88A4A)}
  .tr .nm{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
  .tr .nm .av{width:36px;height:36px;font-size:12px}
  .tr .nm em{font-style:normal;color:var(--green);font-size:12px;font-weight:800}
  .tr span.n{text-align:right;color:var(--ink-2);font-weight:600}
    .tr.you .nm small{display:block;font-size:11.5px;color:var(--blue-700);font-weight:700}
</style></head>
<body>
<header class="appbar">
  <span data-status="light"></span>
  <span data-bar="Leaderboards"></span>
  <div class="top" data-pop style="--d:80ms"><span class="big">DS<span class="cr"><i data-lucide="award" class="xs"></i></span></span><div><small>Top on the leaderboard</small><b>Dwight Schrute</b></div></div>
</header>
<nav class="ptabs"><span class="on">Today</span><span>Week</span><span>Month</span><span>All-time</span></nav>
<div class="th" style="margin-bottom:8px"><span>Rank</span><span>Name</span><span>Calls</span><span>Meetings</span><span>Sales</span></div>
<section id="t" data-stagger="x" style="--d:200ms"></section>
<span data-tabs="Leaderboards"></span>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_shared.js"></script>
<script>
  const R = [['1', 'g', 'Dwight S.', '#F2A21F', '+3', 64, 9, 4], ['2', 's', 'Jim H.', '#2F7BF6', '+1', 58, 8, 3], ['3', 'b', 'Pamela B.', '#E4566F', '+2', 52, 7, 3],
    ['4', '', 'Stanley H.', '#18A56C', '', 47, 6, 2], ['5', '', 'Phyllis V.', '#6246EA', '+1', 44, 5, 2], ['6', '', 'Priya R.', '#F2475F', '', 41, 4, 2, 1], ['7', '', 'Andy B.', '#3CB9F4', '', 39, 4, 1], ['8', '', 'Kevin M.', '#7F86A0', '', 33, 3, 1]];
  t.innerHTML = R.map(r => `<div class="tr ${r[8] ? 'you' : ''}"><span class="rk num">#${r[0]}</span><span class="nm"><span class="av" style="background:${r[3]}">${r[2].split(' ').map(w => w[0]).join('')}</span><span>${r[8] ? 'You' : r[2]} ${r[4] ? `<em>${r[4]}</em>` : ''}</span></span><span class="n num">${r[5]}</span><span class="n num">${r[6]}</span><span class="n num">${r[7]}</span></div>`).join('');
  boot();
</script></body></html>
